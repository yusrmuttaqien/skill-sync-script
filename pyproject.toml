[project]
name = "skillsync"
version = "0.1.0"
description = "Centralized skill management across pi, OpenWebUI, and Obsidian through a local store"
requires-python = ">=3.12"
dependencies = [
    "rich",
]

[project.scripts]
skillsync = "skillsync.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skillsync*"]
